<h1 class="mat-card-title">
  {{ 'TERMS.TITLE' | translate }}
</h1>
<mat-card-subtitle>
  {{ 'TERMS.SUBTITLE' | translate }}
</mat-card-subtitle>
<div mat-dialog-content>
  <mat-card-content>
  <p [innerHTML]="'TERMS.TRADEMARKS' | translate:params"></p><p [innerHTML]="'TERMS.LICENSE_INTRO' | translate:params"></p><p style="margin-left: 15.0pt;" [innerHTML]="'TERMS.ITEM_1' | translate:params"></p><p style="margin-left: 15.0pt;" [innerHTML]="'TERMS.ITEM_2' | translate:params"></p><p style="margin-left: 15.0pt;" [innerHTML]="'TERMS.ITEM_3' | translate:params"></p><p style="margin-left: 15.0pt;" [innerHTML]="'TERMS.ITEM_4' | translate:params"></p><p style="margin-left: 15.0pt;" [innerHTML]="'TERMS.ITEM_5' | translate:params"></p><p style="margin-left: 30.0pt;" [innerHTML]="'TERMS.ITEM_5_A' | translate:params"></p><p style="margin-left: 30.0pt;" [innerHTML]="'TERMS.ITEM_5_B' | translate:params"></p><p style="margin-left: 30.0pt;" [innerHTML]="'TERMS.ITEM_5_C' | translate:params"></p>
  </mat-card-content>
</div>
<div mat-dialog-actions class="pull-right">
  <button mat-stroked-button (click)="onReject()">{{ 'TERMS.REJECT' | translate }}</button>
  <button mat-flat-button (click)="onAccept()">{{ 'TERMS.ACCEPT' | translate }}</button>
</div>
