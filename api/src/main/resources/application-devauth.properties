# LOCAL DEVELOPMENT ONLY - replaces AWS Cognito with the fake identity provider in
# org.snomed.snap2snomed.security.DevAuthController. Anyone can log in as anyone.
# Usage: -Dspring.profiles.active=local,devauth
snap2snomed.security.authDomainUrl=http://localhost:${server.port:8080}/dev-auth
snap2snomed.security.clientId=snap2snomed-devauth
snap2snomed.cors.allowedOriginPatterns=http://localhost:*,https://localhost:*,http://127.0.0.1:*,https://127.0.0.1:*
# Defaults pre-filled in the dev login form
snap2snomed.devauth.defaultEmail=dev@example.com
snap2snomed.devauth.defaultGivenName=Dev
snap2snomed.devauth.defaultFamilyName=User
